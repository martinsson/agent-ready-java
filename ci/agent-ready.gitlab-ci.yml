# GitLab CI template for the agent-ready gates. Use it from another project:
#
#   include:
#     - project: my-group/agent-ready-java     # or `remote:` / `local:`
#       ref: main
#       file: ci/agent-ready.gitlab-ci.yml
#
# It defines the jobs verify:fast, verify:full and verify:changed-lines-coverage. Override any key by
# redefining the job in your .gitlab-ci.yml, or build your own jobs with `extends: .agent-ready:*`.
# The project must contain the verify script, tools/Ratchet.java and config/ (see README).
#
# verify:full needs Docker for Testcontainers: Docker-in-Docker, which needs a privileged runner
# (gitlab.com shared runners are). Without one, set AGENT_READY_FULL: "false".

variables:
  AGENT_READY_IMAGE: maven:3.9.11-eclipse-temurin-25
  AGENT_READY_FULL: "true"

stages:
  - verify

.agent-ready:maven:
  image: $AGENT_READY_IMAGE
  stage: verify
  variables:
    GIT_DEPTH: 0 # the ratchet and diff coverage need the base commit
    MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  cache:
    key:
      files: [pom.xml]
    paths: [.m2/repository]
  before_script:
    # The ratchet compares with the MR base, or with the previous pipeline's commit on a branch.
    - export RATCHET_BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - target/verify.log
      - target/site/jacoco/
      - target/pit-reports/
      - target/pmd.xml
      - target/cpd.xml
      - target/checkstyle-result.xml
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml

.agent-ready:docker:
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    TESTCONTAINERS_RYUK_DISABLED: "true" # the dind service is thrown away with the job

verify:fast:
  extends: .agent-ready:maven
  script:
    - ./verify

verify:full:
  extends: [.agent-ready:maven, .agent-ready:docker]
  needs: [verify:fast]
  rules:
    - if: $AGENT_READY_FULL == "true"
  script:
    - ./verify --full

# Ratchet for coverage: lines changed by the MR must be covered, whatever the global ratio is.
verify:changed-lines-coverage:
  image: python:3.12
  stage: verify
  needs:
    - job: verify:full
      artifacts: true
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $AGENT_READY_FULL == "true"
  script:
    - pip install --quiet diff-cover==10.6.0
    - >
      diff-cover target/site/jacoco/jacoco.xml
      --compare-branch="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      --src-roots src/main/java
      --fail-under=80
