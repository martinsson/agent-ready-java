# A rule that matches no classes fails instead of silently passing (catches typos in package names).
archRule.failOnEmptyShould=true

# Ratchet: every rule in ArchitectureTest is wrapped in FreezingArchRule.freeze(...). Violations
# recorded in this store are tolerated, any other violation fails. The store is read-only here;
# `./verify --baseline` rewrites it (it passes -Darchunit.freeze.refreeze=true and
# -Darchunit.freeze.store.default.allowStoreUpdate=true), and `./verify` refuses a store that grows.
freeze.store.default.path=config/baseline/archunit
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=true
freeze.refreeze=false
